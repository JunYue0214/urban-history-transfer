[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-history-transfer"
version = "0.0.1"
description = "Infrastructure for the Urban Development History and Environmental Response Transferability project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scipy>=1.17.1",
    "matplotlib>=3.11.2",
    "pyarrow>=25.0.1",
    "PyYAML>=6.0.3",
    "geopandas>=1.2.0",
    "shapely>=2.1.2",
    "pyproj>=3.7.2",
    "rasterio>=1.4.4",
    "xarray>=2026.9.0",
    "rioxarray>=0.19.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
